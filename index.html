
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaveTimer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  background: #101512;
  color: #f3f5f3;
  font-family: -apple-system, sans-serif;
}

h1 {
  text-align: center;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aab5ad;
}

.timer {
  max-width: 500px;
  margin: 22px auto;
  padding: 22px;
  background: #202923;
  border: 1px solid #39483d;
  border-radius: 20px;
}

h2 {
  font-size: 21px;
  margin: 0 0 14px;
}

.time {
  font-size: 52px;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
  margin: 20px 0;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 12px;
  padding: 14px 8px;
  font-size: 16px;
  font-weight: 600;
  background: #d9e9dc;
  color: #17251b;
  cursor: pointer;
}

button.stop {
  background: #39483e;
  color: white;
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.status {
  text-align: center;
  color: #b5c7b8;
  min-height: 24px;
}
</style>
</head>

<body>

<h1>🍷 CaveTimer</h1>
<p class="subtitle">Barrel cleaning timers</p>

<div id="timers"></div>

<script>
const settings = [
  { name: "Hot Water Barrel Wash", minutes: 9 },
  { name: "Steaming", minutes: 9 },
  { name: "Cold Water Barrel Wash", minutes: 5 }
];

const timers = settings.map((s, i) => ({
  ...s,
  remaining: s.minutes * 60,
  running: false,
  finished: false,
  end: 0,
  interval: null,
  id: i
}));

const container = document.getElementById("timers");

function format(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;

  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

// Create all three timer cards
container.innerHTML = timers.map(t => `
  <section class="timer">

    <h2>${t.name}</h2>

    <div class="time" id="time${t.id}">
      ${format(t.remaining)}
    </div>

    <p class="status" id="status${t.id}">
      Ready
    </p>

    <div class="buttons">
      <button class="stop" id="minus${t.id}">
        −1 min
      </button>

      <button class="stop" id="plus${t.id}">
        +1 min
      </button>
    </div>

    <div class="buttons">
      <button id="start${t.id}">
        ▶ Start
      </button>

      <button class="stop" id="reset${t.id}">
        ↻ Reset
      </button>
    </div>

  </section>
`).join("");

function updateDisplay(t) {
  document.getElementById("time" + t.id).textContent =
    format(t.remaining);

  // Time adjustment is only available before starting
  document.getElementById("plus" + t.id).disabled =
    t.running || t.finished;

  document.getElementById("minus" + t.id).disabled =
    t.running || t.finished || t.remaining <= 60;

  document.getElementById("start" + t.id).disabled =
    t.running || t.finished;
}

function adjustTime(id, minutes) {
  const t = timers[id];

  // Prevent changes while running or finished
  if (t.running || t.finished) return;

  t.remaining += minutes * 60;

  // Minimum timer duration: 1 minute
  if (t.remaining < 60) {
    t.remaining = 60;
  }

  updateDisplay(t);
}

function startTimer(id) {
  const t = timers[id];

  if (t.running || t.finished || t.remaining <= 0) {
    return;
  }

  t.running = true;
  t.end = Date.now() + t.remaining * 1000;

  document.getElementById("status" + id).textContent =
    "Running...";

  updateDisplay(t);

  t.interval = setInterval(() => {
    t.remaining = Math.max(
      0,
      Math.ceil((t.end - Date.now()) / 1000)
    );

    updateDisplay(t);

    if (t.remaining <= 0) {
      clearInterval(t.interval);

      t.running = false;
      t.finished = true;

      document.getElementById("status" + id).textContent =
        "✓ DONE – Cleaning finished!";

      updateDisplay(t);

      if ("vibrate" in navigator) {
        navigator.vibrate([300, 150, 300]);
      }

      alert(t.name + " – Time is up!");
    }
  }, 250);
}

function resetTimer(id) {
  const t = timers[id];

  clearInterval(t.interval);

  t.running = false;
  t.finished = false;

  // Restore original default time
  t.remaining = t.minutes * 60;

  document.getElementById("status" + id).textContent =
    "Ready";

  updateDisplay(t);
}

// Connect each timer's own buttons
timers.forEach(t => {
  document.getElementById("minus" + t.id)
    .addEventListener("click", () => {
      adjustTime(t.id, -1);
    });

  document.getElementById("plus" + t.id)
    .addEventListener("click", () => {
      adjustTime(t.id, 1);
    });

  document.getElementById("start" + t.id)
    .addEventListener("click", () => {
      startTimer(t.id);
    });

  document.getElementById("reset" + t.id)
    .addEventListener("click", () => {
      resetTimer(t.id);
    });

  updateDisplay(t);
});
</script>

</body>
</html>
